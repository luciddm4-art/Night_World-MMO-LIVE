# Render "Blueprint": describes the game server so it can be recreated in one click
# (Render dashboard -> New -> Blueprint -> pick this repo).
# Keep the name: the client and the keep-alive workflow call night-world-mmo-live.onrender.com.
services:
  - type: web
    name: night-world-mmo-live
    runtime: node
    plan: free
    region: frankfurt # closest to most players; change if yours are elsewhere
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false # you paste the Neon connection string in Render's dashboard; it is never stored in git
