<body>
<div id="cap">Night World Online — World 1</div>
<div id="hpwrap"><div id="hpfill"></div></div>
<div id="hplabel">HP 1200 / 1200</div>
<div id="mpwrap"><div id="mpfill"></div></div>
<div id="mplabel"></div>
<div id="hud"></div>
<div id="who"></div>
<div id="chatlog"></div>
<button id="chatbtn" type="button">Chat</button>
<button id="gear" type="button" aria-label="Settings">&#9881;</button>
<div id="settings"></div>
<form id="chatform" autocomplete="off"><input id="chatin" maxlength="120" placeholder="Say something… (Enter to send)"><button type="submit">Send</button></form>
<canvas id="mm" width="96" height="96"></canvas>
<div id="inv">
  <div id="invhead">Inventory<span class="sum" id="invsum"></span><span class="chev">&#9650;</span><button id="craftbtn" type="button">Craft</button></div>
  <div id="invbody"><div id="eq"></div><div id="grid"></div></div>
</div>
<div id="stick"><div id="knob"></div></div>
<button id="mount" type="button">Mount</button>
<button id="atk" type="button">Attack</button>
<button id="use" type="button">Use</button>
<div id="castlabel"></div>
<div id="cast"><div id="castfill"></div></div>
<div id="panel"></div>
<div id="netbanner"></div>
<div id="toasts"></div>
<div id="fx"></div>
<div id="hurt"></div>
<div id="hint">Stick/WASD move &middot; drag look &middot; Space attack &middot; E gather/craft &middot; I inventory &middot; C station &middot; Enter chat</div>
<div id="err"></div>
<div id="boot"><div class="card"><h2>Night World Online</h2><div class="spin"></div><p id="bootmsg">Connecting…</p><p class="sub" id="boothint"></p></div></div>
<div id="auth"><form class="card" id="authform" autocomplete="on">
  <h2>Night World Online</h2>
  <p>Log in to keep your character, or jump in as a guest.</p>
  <input id="authname" name="username" placeholder="Name (3-16 letters, numbers, _)" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false">
  <input id="authpass" name="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" maxlength="64">
  <div id="autherr"></div>
  <div class="row"><button type="submit" id="loginbtn">Log in</button><button type="button" id="regbtn">Register</button></div>
  <div class="row"><button type="button" class="alt" id="guestbtn">Play as guest (progress is not saved)</button></div>
</form></div>
<script src="vendor/three.min.js"></script>
