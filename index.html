<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night World Online — World 1</title>
<style>
:root{--bg:#0b0e1a;--ink:#f2d34a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:grab}
#cap{position:fixed;left:0;right:0;top:0;text-align:left;color:var(--ink);font-weight:700;font-size:clamp(14px,3.6vw,22px);padding:14px 100px 0 12px;text-shadow:0 2px 0 #000;pointer-events:none;z-index:2}
#mm{inset:auto;position:fixed;right:8px;top:14px;left:auto;bottom:auto;width:80px;height:80px;border-radius:50%;border:2px solid rgba(242,211,74,.6);background:#0b0e1a;z-index:2;touch-action:none;pointer-events:none;cursor:default}
#hud{position:fixed;left:12px;top:48px;z-index:2;color:#f2d34a;font:600 12px Georgia,serif;white-space:pre-line;text-shadow:0 1px 0 #000;pointer-events:none;line-height:1.5}
#hpwrap{position:fixed;left:12px;top:36px;z-index:2;width:min(220px,50vw);height:12px;border:2px solid rgba(242,211,74,.5);border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden}
#hpfill{height:100%;background:linear-gradient(90deg,#7a1a1a,#c83232);transition:width .15s}
#hplabel{position:fixed;left:12px;top:36px;z-index:3;width:min(220px,50vw);height:12px;text-align:center;font:700 10px Georgia,serif;color:#fff;text-shadow:0 1px 0 #000;line-height:12px;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:60px;z-index:2;text-align:center;color:#9aa6c8;font-size:12px;padding:0 90px;pointer-events:none;text-shadow:0 1px 0 #000}
#stick{position:fixed;left:18px;bottom:44px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35);z-index:2;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none}
#atk{position:fixed;right:22px;bottom:56px;width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,120,100,.8);background:rgba(200,50,40,.45);color:#fff;font:700 15px Georgia,serif;padding:0;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#atk:active{background:rgba(230,70,55,.75)}
#atk:disabled{opacity:.35}
#mount{position:fixed;right:112px;bottom:56px;width:84px;height:84px;border-radius:50%;border:2px solid rgba(120,200,255,.8);background:rgba(40,100,180,.45);color:#fff;font:700 13px Georgia,serif;padding:0;z-index:2;display:none;touch-action:none;user-select:none}
#mount:active{background:rgba(60,140,220,.75)}
#use{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;z-index:3;display:none;padding:12px 20px;border-radius:24px;border:2px solid #f2d34a;background:rgba(11,14,26,.85);color:#f2d34a;font:700 16px Georgia,serif}
#cast{position:fixed;left:50%;transform:translateX(-50%);bottom:170px;z-index:5;display:none;width:min(260px,70vw);height:18px;border:2px solid #f2d34a;border-radius:10px;background:rgba(11,14,26,.9);overflow:hidden}
#castfill{height:100%;width:0;background:linear-gradient(90deg,#f2d34a,#c8a030)}
#castlabel{position:fixed;left:50%;transform:translateX(-50%);bottom:192px;z-index:5;display:none;color:#f2d34a;font:700 12px Georgia,serif;text-shadow:0 1px 0 #000;pointer-events:none}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(340px,90vw);max-height:76vh;overflow:auto;display:none;background:rgba(11,14,26,.96);border:2px solid #f2d34a;border-radius:12px;padding:12px;color:#f2d34a;font-family:Georgia,serif}
#panel h3{margin:0 0 6px;font-size:20px;text-align:center}
#panel h4{margin:10px 0 4px;font-size:14px;color:#cfd6ec;text-align:center;letter-spacing:.1em;text-transform:uppercase}
#panel p{margin:4px 0 8px;font-size:13px;color:#cfd6ec;text-align:center}
.b{display:flex;justify-content:space-between;align-items:center;width:100%;margin:5px 0;padding:10px 12px;border-radius:8px;border:1px solid rgba(242,211,74,.5);background:rgba(242,211,74,.12);color:#fff;font:600 14px Georgia,serif;text-align:left}
.b:disabled{opacity:.4}
.b.x{justify-content:center;background:rgba(200,50,40,.35);border-color:rgba(255,120,100,.6)}
.b small{opacity:.6;font-weight:400}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:7;max-width:80vw;text-align:center;color:#fff;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:10px;font:600 14px Georgia,serif;opacity:0;transition:opacity .25s;pointer-events:none}
#inv{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;z-index:4;width:min(460px,96vw);background:rgba(11,14,26,.92);border:2px solid rgba(242,211,74,.6);border-radius:10px;font-family:Georgia,serif;color:#f2d34a;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 -4px 16px rgba(0,0,0,.5)}
#invhead{padding:8px 12px;text-align:center;font:700 13px Georgia,serif;color:#f2d34a;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;position:relative}
#invhead .chev{display:inline-block;transition:transform .15s}
#inv.open #invhead .chev{transform:rotate(180deg)}
#invhead .sum{color:#cfd6ec;font-weight:600;font-size:12px}
#invhead button{position:absolute;right:8px;top:6px;padding:4px 10px;border-radius:6px;border:1px solid rgba(242,211,74,.6);background:rgba(242,211,74,.15);color:#f2d34a;font:700 11px Georgia,serif}
#invbody{display:none;padding:8px;border-top:1px solid rgba(242,211,74,.25);max-height:54vh;overflow:auto}
#inv.open #invbody{display:block}
#eq{display:grid;grid-template-columns:repeat(7,34px);gap:4px;justify-content:center;margin-bottom:8px}
.eqslot{width:34px;height:34px;border:1px solid rgba(242,211,74,.4);border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);font-size:11px;font-weight:700;color:rgba(242,211,74,.5);position:relative}
.eqslot.filled{background:rgba(242,211,74,.22);border-color:#f2d34a;color:#fff;text-shadow:0 1px 0 #000;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.islot{aspect-ratio:1;border:1px solid rgba(242,211,74,.2);border-radius:4px;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;position:relative;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 0 #000}
.islot.filled{border-color:rgba(242,211,74,.75);background:rgba(242,211,74,.18);cursor:pointer}
.islot .n{position:absolute;right:1px;bottom:0;font-size:9px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
#err{position:fixed;inset:auto 8px 8px 8px;max-height:40vh;overflow:auto;z-index:99;display:none;background:rgba(120,0,0,.92);color:#fff;font:600 12px monospace;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div id="cap">Night World Online — World 1</div>
<div id="hpwrap"><div id="hpfill"></div></div>
<div id="hplabel">HP 1200 / 1200</div>
<div id="hud"></div>
<canvas id="mm" width="96" height="96"></canvas>
<div id="inv">
  <div id="invhead">Inventory<span class="sum" id="invsum"></span><span class="chev">&#9650;</span><button id="craftbtn" type="button">Craft</button></div>
  <div id="invbody"><div id="eq"></div><div id="grid"></div></div>
</div>
<div id="stick"><div id="knob"></div></div>
<button id="mount" type="button">Mount</button>
<button id="atk" type="button">Attack</button>
<button id="use" type="button">Use</button>
<div id="castlabel"></div>
<div id="cast"><div id="castfill"></div></div>
<div id="panel"></div>
<div id="toast"></div>
<div id="hint">Stick/WASD move &middot; drag look &middot; Space attack &middot; E gather/craft &middot; I inventory &middot; C craft</div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var errEl=document.getElementById('err');
function showErr(m){errEl.style.display='block';errEl.textContent+=(errEl.textContent?'\n\n':'')+m}
window.addEventListener('error',function(e){showErr('Error: '+(e.message||e.error)+'\n'+(e.filename||'')+':'+(e.lineno||''))});
if(typeof THREE==='undefined'){showErr('THREE failed to load.');return}

try{
/* ============ CONFIG ============ */
var SEED=(function(){var m=location.search.match(/[?&]seed=(-?\d+)/);return m?parseInt(m[1],10):7})();
var CS=32, SEG=16, VR=4;
var RESPAWN_MS=10000;
var GATHER_MS=2000;
var RABBIT_HP=50, RABBIT_DMG=25, RABBIT_ATK_MS=1500;
var PLAYER_BASE_HP=1200, PLAYER_BASE_DMG=30, PLAYER_BASE_ATK_MS=400;
var MOUNT_SPEED=1.15, MOUNT_CAST_MS=1500, DONKEY_LEASH=18;
var REGEN_PER_SEC=0.01, REGEN_COMBAT_LOCK=5000;
var WS_URL='wss://night-world-mmo-live.onrender.com';
var SAVE_KEY='nwo_w1_save';

/* ============ SHARED STATE ============ */
var NODE_STATE={}, TREE_STATE={}, RABBITS={}, lastC=null;
var scene=null, cam=null, renderer=null;
var chunks={}, cT={};
var fr=0;

/* ============ ITEMS ============ */
var ITEMS={
  wood:{n:'Wood',s:'W'}, cotton:{n:'Cotton',s:'C'}, ore:{n:'Ore',s:'O'}, hide:{n:'Hide',s:'H'},
  plank:{n:'Plank',s:'P'}, cloth:{n:'Cloth',s:'L'}, iron:{n:'Iron Bar',s:'I'}, leather:{n:'Leather',s:'E'},
  sword:{n:'Sword',s:'SW'}, fire_staff:{n:'Fire Staff',s:'FS'}, bow:{n:'Bow',s:'BW'},
  torch:{n:'Torch',s:'TC'}, spell_book:{n:'Spell Book',s:'SB'},
  iron_helm:{n:'Iron Helm',s:'IH'}, iron_chest:{n:'Iron Chest',s:'IC'}, iron_gauntlets:{n:'Iron Gauntlets',s:'IG'}, iron_boots:{n:'Iron Boots',s:'IB'},
  cloth_cowl:{n:'Cloth Cowl',s:'CC'}, cloth_robe:{n:'Cloth Robe',s:'CR'}, cloth_gloves:{n:'Cloth Gloves',s:'CG'}, cloth_sandals:{n:'Cloth Sandals',s:'CS'},
  leather_hood:{n:'Leather Hood',s:'LH'}, leather_jacket:{n:'Leather Jacket',s:'LJ'}, leather_gloves:{n:'Leather Gloves',s:'LG'}, leather_boots:{n:'Leather Boots',s:'LB'},
  donkey:{n:'Donkey',s:'DK'}
};

var EQUIP_SLOTS=['head','chest','hands','foot','main','off','mount'];
var SLOT_LABEL={head:'HD',chest:'CH',hands:'HN',foot:'FT',main:'MH',off:'OH',mount:'MT'};
var SLOT_ACCEPTS={
  head:['iron_helm','cloth_cowl','leather_hood'],
  chest:['iron_chest','cloth_robe','leather_jacket'],
  hands:['iron_gauntlets','cloth_gloves','leather_gloves'],
  foot:['iron_boots','cloth_sandals','leather_boots'],
  main:['sword','fire_staff','bow','torch'],
  off:['spell_book','torch'],
  mount:['donkey']
};

var ARMOR_STATS={
  iron_helm:{hp:0.03}, iron_chest:{hp:0.50,def:0.20}, iron_gauntlets:{hp:0.03}, iron_boots:{hp:0.03},
  cloth_cowl:{dmg:0.05}, cloth_robe:{dmg:0.50}, cloth_gloves:{dmg:0.05}, cloth_sandals:{dmg:0.05},
  leather_hood:{dmg:0.03,haste:0.03}, leather_jacket:{dmg:0.30,haste:0.05},
  leather_gloves:{dmg:0.03,haste:0.03}, leather_boots:{dmg:0.03,haste:0.03}
};

var RECIPES=[
  {id:'r_plank', cat:'Refine', name:'Plank', out:'plank', n:1, cost:{wood:3}, station:'refinery'},
  {id:'r_cloth', cat:'Refine', name:'Cloth', out:'cloth', n:1, cost:{cotton:3}, station:'loom'},
  {id:'r_iron',  cat:'Refine', name:'Iron Bar', out:'iron', n:1, cost:{ore:3}, station:'forge'},
  {id:'r_leather',cat:'Refine',name:'Leather', out:'leather', n:1, cost:{hide:3}, station:'tannery'},

  {id:'c_sword', cat:'Weapons', name:'Sword', out:'sword', n:1, cost:{plank:3, iron:3}},
  {id:'c_staff', cat:'Weapons', name:'Fire Staff', out:'fire_staff', n:1, cost:{plank:3, cloth:3}},
  {id:'c_bow',   cat:'Weapons', name:'Bow', out:'bow', n:1, cost:{plank:4, cloth:2}},

  {id:'c_torch', cat:'Tools', name:'Torch x3', out:'torch', n:3, cost:{wood:2, cloth:1}},
  {id:'c_book',  cat:'Tools', name:'Spell Book', out:'spell_book', n:1, cost:{cloth:3, leather:2}},

  {id:'c_ihelm', cat:'Iron Armor', name:'Iron Helm', out:'iron_helm', n:1, cost:{iron:3}},
  {id:'c_ichest',cat:'Iron Armor', name:'Iron Chestplate', out:'iron_chest', n:1, cost:{iron:5}},
  {id:'c_ignt',  cat:'Iron Armor', name:'Iron Gauntlets', out:'iron_gauntlets', n:1, cost:{iron:3}},
  {id:'c_iboot', cat:'Iron Armor', name:'Iron Boots', out:'iron_boots', n:1, cost:{iron:3}},

  {id:'c_ccowl', cat:'Cloth Armor', name:'Cloth Cowl', out:'cloth_cowl', n:1, cost:{cloth:3}},
  {id:'c_crobe', cat:'Cloth Armor', name:'Cloth Robe', out:'cloth_robe', n:1, cost:{cloth:5}},
  {id:'c_cglv',  cat:'Cloth Armor', name:'Cloth Gloves', out:'cloth_gloves', n:1, cost:{cloth:3}},
  {id:'c_csand', cat:'Cloth Armor', name:'Cloth Sandals', out:'cloth_sandals', n:1, cost:{cloth:3}},

  {id:'c_lhood', cat:'Leather Armor', name:'Leather Hood', out:'leather_hood', n:1, cost:{leather:3}},
  {id:'c_ljack', cat:'Leather Armor', name:'Leather Jacket', out:'leather_jacket', n:1, cost:{leather:5}},
  {id:'c_lglv',  cat:'Leather Armor', name:'Leather Gloves', out:'leather_gloves', n:1, cost:{leather:3}},
  {id:'c_lboot', cat:'Leather Armor', name:'Leather Boots', out:'leather_boots', n:1, cost:{leather:3}}
];

var WORLDS=[
  {name:'Ashen', seed:42, tag:'scorched & grey'},
  {name:'Frost', seed:100, tag:'cold pale stone'},
  {name:'Ember', seed:999, tag:'red earth & dust'},
  {name:'Hollow', seed:2025, tag:'silent dark woods'}
];

/* ============ NOISE ============ */
function sstep(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}
function h2(i,j){var n=Math.sin(i*127.1+j*311.7+SEED*13.37)*43758.5453;return n-Math.floor(n)}
function vn(x,z){var i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j;fx=fx*fx*(3-2*fx);fz=fz*fz*(3-2*fz);
 var a=h2(i,j),b=h2(i+1,j),c=h2(i,j+1),d=h2(i+1,j+1);return a+(b-a)*fx+(c-a)*fz+(a-b-c+d)*fx*fz}
function hgt(x,z){var e=vn(x*.008,z*.008)*30+vn(x*.02,z*.02)*10+vn(x*.06,z*.06)*3-12;
 if(e<0)e*=.2;return e*sstep(22,60,Math.hypot(x,z))}
function rnd(s){return function(){s=(s*16807)%2147483647;return s/2147483647}}
var R=rnd(SEED*7+1);

/* ============ INVENTORY ============ */
var INV={eq:{head:null,chest:null,hands:null,foot:null,main:null,off:null,mount:null},slots:new Array(64).fill(null)};
try{var iv=JSON.parse(localStorage.getItem('nwo_w1')||'null');
 if(iv&&iv.slots&&iv.slots.length===64&&iv.eq)INV=iv}catch(e){}

/* ============ SAVE / LOAD ============ */
function saveInv(){try{localStorage.setItem('nwo_w1',JSON.stringify(INV))}catch(e){}}
function saveAll(){
  try{
    var dpos = donkeyMesh ? {x:donkeyMesh.position.x, z:donkeyMesh.position.z} : donkeyHomePos;
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      inv:INV,
      seed:SEED,
      p:{x:P.x, z:P.z, r:P.r},
      hpRatio: PSTATS.maxHp>0 ? PSTATS.hp/PSTATS.maxHp : 1,
      mounted:mounted,
      donkey:dpos,
      nodes:NODE_STATE,
      trees:TREE_STATE
    }));
  }catch(e){}
}
function loadAll(){
  try{
    var s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(!s) return null;
    if(s.inv && s.inv.slots && s.inv.slots.length===64 && s.inv.eq){
      INV.eq = s.inv.eq;
      INV.slots = s.inv.slots;
    }
    if(s.p){ P.x=s.p.x; P.z=s.p.z; P.r=s.p.r||P.r; }
    if(s.nodes){ for(var k in s.nodes) NODE_STATE[k]=s.nodes[k]; }
    if(s.trees){ for(var kt in s.trees) TREE_STATE[kt]=s.trees[kt]; }
    if(s.donkey) donkeyHomePos = s.donkey;
    return s;
  }catch(e){ return null; }
}
addEventListener('beforeunload',function(){ try{saveAll()}catch(e){} });

/* ---------- inventory helpers ---------- */
function countItem(id){var n=0;for(var i=0;i<64;i++){var s=INV.slots[i];if(s&&s.id===id)n+=s.n}return n}
function removeItems(id,count){for(var i=0;i<64;i++){var s=INV.slots[i];if(!s||s.id!==id)continue;
 var t=Math.min(s.n,count);s.n-=t;count-=t;if(s.n<=0)INV.slots[i]=null;if(count<=0)break}renderInv();saveInv()}
function addItem(id,n){for(var i=0;i<64;i++){var s=INV.slots[i];
 if(s&&s.id===id&&s.n<99){s.n+=n;renderInv();saveInv();return true}}
 for(var j=0;j<64;j++){if(!INV.slots[j]){INV.slots[j]={id:id,n:n};renderInv();saveInv();return true}}
 say('Inventory full');return false}

var invOpen=false,invEl=document.getElementById('inv'),invSum=document.getElementById('invsum');
function toggleInv(){invOpen=!invOpen;invEl.classList.toggle('open',invOpen)}
document.getElementById('invhead').addEventListener('click',function(e){if(e.target.id==='craftbtn')return;toggleInv()});
document.getElementById('craftbtn').addEventListener('click',function(e){e.stopPropagation();openCraft(null)});

function renderInv(){
  EQUIP_SLOTS.forEach(function(s){
    var el=document.querySelector('.eqslot[data-slot="'+s+'"]');if(!el)return;
    var it=INV.eq[s];el.classList.toggle('filled',!!it);
    el.textContent=it?(ITEMS[it.id]?ITEMS[it.id].s:'?'):SLOT_LABEL[s];});
  var h='';
  for(var i=0;i<64;i++){var it2=INV.slots[i];
    if(it2){var dd=ITEMS[it2.id]||{s:'?',n:'?'};
      h+='<div class="islot filled" data-i="'+i+'" title="'+dd.n+'">'+dd.s+(it2.n>1?'<span class="n">'+it2.n+'</span>':'')+'</div>'}
    else h+='<div class="islot"></div>'}
  document.getElementById('grid').innerHTML=h;
  var parts=[];
  ['wood','cotton','ore','hide','plank','cloth','iron','leather'].forEach(function(id){
    var n=countItem(id);if(n>0)parts.push(ITEMS[id].s+' '+n)});
  invSum.textContent=parts.length?'  '+parts.join('  '):''}

document.getElementById('grid').addEventListener('click',function(e){
  var el=e.target.closest('.islot.filled');if(!el)return;
  var i=parseInt(el.getAttribute('data-i'),10);var it=INV.slots[i];if(!it)return;
  for(var s=0;s<EQUIP_SLOTS.length;s++){
    var slot=EQUIP_SLOTS[s];
    if(SLOT_ACCEPTS[slot] && SLOT_ACCEPTS[slot].indexOf(it.id)!==-1){
      var cur=INV.eq[slot];
      INV.eq[slot]={id:it.id,n:1};
      it.n--;
      if(it.n<=0)INV.slots[i]=null;
      if(cur)addItem(cur.id,cur.n);
      saveInv();renderInv();recalcStats();updateMountButton();checkDonkeyReward();
      saveAll();
      say('Equipped '+ITEMS[it.id].n);return;
    }
  }
  say('Cannot equip that');});

document.getElementById('eq').addEventListener('click',function(e){
  var el=e.target.closest('.eqslot.filled');if(!el)return;
  var slot=el.getAttribute('data-slot');var it=INV.eq[slot];if(!it)return;
  INV.eq[slot]=null;addItem(it.id,it.n);saveInv();renderInv();recalcStats();updateMountButton();
  saveAll();say('Unequipped');});

/* ============ PLAYER STATS ============ */
var PSTATS={hp:PLAYER_BASE_HP,maxHp:PLAYER_BASE_HP,dmg:1,haste:0,def:0};
var lastDamageT=0;
function recalcStats(){
  var hpMult=1,dmg=1,haste=0,def=0;
  EQUIP_SLOTS.forEach(function(s){
    var it=INV.eq[s];if(!it)return;
    var st=ARMOR_STATS[it.id];if(!st)return;
    if(st.hp)hpMult+=st.hp;
    if(st.dmg)dmg+=st.dmg;
    if(st.haste)haste+=st.haste;
    if(st.def)def+=st.def;});
  var newMax=Math.round(PLAYER_BASE_HP*hpMult);
  var ratio=PSTATS.hp/PSTATS.maxHp;
  PSTATS.maxHp=newMax;PSTATS.hp=Math.min(newMax,Math.round(newMax*ratio));
  PSTATS.dmg=dmg;PSTATS.haste=haste;PSTATS.def=def;
  updateHPUI();updateHud();}
function updateHPUI(){
  var pct=Math.max(0,PSTATS.hp/PSTATS.maxHp);
  document.getElementById('hpfill').style.width=(pct*100)+'%';
  document.getElementById('hplabel').textContent='HP '+Math.max(0,Math.round(PSTATS.hp))+' / '+PSTATS.maxHp;}

function updateWorld(){var cx=Math.floor(P.x/CS),cz=Math.floor(P.z/CS);
 if(lastC&&lastC[0]===cx&&lastC[1]===cz)return;lastC=[cx,cz];
 for(var k in chunks){var c=chunks[k];
  if(Math.abs(c.cx-cx)>VR||Math.abs(c.cz-cz)>VR){
   scene.remove(c.m);c.m.geometry.dispose();
   if(c.nodes)c.nodes.forEach(function(n){scene.remove(n.mesh)});
   delete chunks[k]}}
 var now=performance.now(),n=0;
 for(var i2=-VR;i2<=VR;i2++)for(var j2=-VR;j2<=VR;j2++){var X=cx+i2,Z=cz+j2,key=X+','+Z;
  if(!chunks[key]){
   var c2={cx:X,cz:Z,m:mkChunk(X,Z),nodes:[]};
   chunks[key]=c2;
   var res=cres(X,Z);
   for(var r=0;r<res.length;r++){var nd=res[r];
    if(!NODE_STATE[nd.id])NODE_STATE[nd.id]={qty:3,readyAt:0};
    var st=NODE_STATE[nd.id];
    var mesh=nd.type==='cotton'?mkCotton():mkOre();
    mesh.position.set(nd.x,hgt(nd.x,nd.z),nd.z);
    mesh.visible=st.qty>0;scene.add(mesh);
    c2.nodes.push({mesh:mesh,def:nd,state:st})}
   var rabs=crabbits(X,Z);
   for(var q2=0;q2<rabs.length;q2++){var rb=rabs[q2];
    if(RABBITS[rb.id])continue;
    var rg=mkRabbit();rg.position.set(rb.x,hgt(rb.x,rb.z),rb.z);scene.add(rg);
    RABBITS[rb.id]={mesh:rg,x:rb.x,z:rb.z,hp:RABBIT_HP,mode:'wander',tx:rb.x,tz:rb.z,wt:0,atkT:0,dead:false,home:[X,Z]}}
  }
  var t=ctrees(X,Z);
  for(var q=0;q<t.length;q+=3){var tk=X+','+Z+','+(q/3);
   if(!treeReady(tk,now))continue;
   var x=t[q],z=t[q+1],k2=t[q+2],y=hgt(x,z);tsv.set(k2,k2,k2);
   tm.compose(tp.set(x,y+1.5*k2,z),tq,tsv);trunk.setMatrixAt(n,tm);
   tm.compose(tp.set(x,y+4.2*k2,z),tq,tsv);fol.setMatrixAt(n,tm);
   tm.compose(tp.set(x,y+6.4*k2,z),tq,tsv);fol2.setMatrixAt(n,tm);n++}}

 trunk.instanceMatrix.needsUpdate=fol.instanceMatrix.needsUpdate=fol2.instanceMatrix.needsUpdate=true;

function mkFig(col){
  var g=new T.Group(),m=new T.MeshLambertMaterial({color:col});
  var torso=new T.Group();g.add(torso);g.userData.torso=torso;
  var b=new T.Mesh(new T.BoxGeometry(.7,1.1,.4),m);b.position.y=1.15;torso.add(b);
  var head=new T.Mesh(new T.BoxGeometry(.45,.45,.45),new T.MeshLambertMaterial({color:0xc8a98a}));
  head.position.y=2;torso.add(head);
  var nose=new T.Mesh(new T.BoxGeometry(.12,.12,.2),new T.MeshBasicMaterial({color:0x222222}));
  nose.position.set(0,2,.3);torso.add(nose);
  var legGeo=new T.BoxGeometry(.25,.7,.3);legGeo.translate(0,-.35,0);
  var legL=new T.Mesh(legGeo,m);legL.position.set(-.2,.7,0);g.add(legL);
  var legR=new T.Mesh(legGeo,m);legR.position.set(.2,.7,0);g.add(legR);
  var armGeo=new T.BoxGeometry(.22,.65,.28);armGeo.translate(0,-.32,0);
  var armL=new T.Mesh(armGeo,m);armL.position.set(-.47,1.6,0);torso.add(armL);
  var armR=new T.Mesh(armGeo,m);armR.position.set(.47,1.6,0);torso.add(armR);
  var sl=new T.Mesh(new T.RingGeometry(1,1.9,16,1,-Math.PI/2-1,2),
    new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,side:T.DoubleSide,depthWrite:false,fog:false}));
  sl.rotation.x=-Math.PI/2;sl.position.y=1.2;g.add(sl);
  g.userData.legL=legL;g.userData.legR=legR;g.userData.armL=armL;g.userData.armR=armR;
  g.userData.sl=sl;g.userData.t=-9999;g.userData.phase=0;g.userData.phase0=Math.random()*6.283;
  return g}

var ANIM_SCALE=0.4;
function animFig(g,dt,speed,now){
  var u=g.userData;var walkAmt=Math.min(1,speed/7);
  u.phase+=dt*(2+speed*1.6)*ANIM_SCALE;
  var s=Math.sin(u.phase),t=now*0.001;
  u.legL.rotation.x=s*0.85*walkAmt;u.legR.rotation.x=-s*0.85*walkAmt;
  u.armL.rotation.x=-s*0.75*walkAmt;u.armR.rotation.x=s*0.75*walkAmt;
  var idle=Math.sin(t*1.6+u.phase0)*0.06*(1-walkAmt);
  u.armL.rotation.x+=idle;u.armR.rotation.x-=idle;
  u.torso.position.y=Math.abs(s)*0.07*walkAmt+Math.sin(t*2+u.phase0)*0.02*(1-walkAmt);
  u.torso.rotation.x=walkAmt*0.12;u.torso.rotation.y*=0.85;
  var age=now-u.t;
  if(age>=0&&age<320){var sw=Math.sin((age/320)*Math.PI);
   u.armR.rotation.x=0.75*walkAmt*s-2.6*sw;u.armR.rotation.z=-0.9*sw;
   u.armL.rotation.x=-0.75*walkAmt*s-0.5*sw;u.torso.rotation.y=0.5*sw;u.torso.rotation.x+=0.18*sw}
  else{u.armR.rotation.z*=0.8}}
function upS(g,now){var u=(now-g.userData.t)/250,m=g.userData.sl;
 m.material.opacity=u<1?.8*(1-u):0;m.scale.setScalar(.8+.5*Math.min(1,u))}

var openPanelType=null,openStation=null,interact=null,tt=0;
function say(m){toast.textContent=m;toast.style.opacity=1;clearTimeout(tt);tt=setTimeout(function(){toast.style.opacity=0},2200)}
function row(l,c,a,ok){return '<button class="b" data-a="'+a+'"'+(ok?'':' disabled')+'><span>'+l+'</span><span>'+c+'</span></button>'}

function canAfford(cost){for(var k in cost){if(countItem(k)<cost[k])return false}return true}
function costStr(cost){var p=[];for(var k in cost)p.push(cost[k]+' '+ITEMS[k].s);return p.join(' + ')}

function openCraft(station){
  openPanelType='craft';openStation=station;
  renderPanel();panel.style.display='block';}
function closePanel(){openPanelType=null;openStation=null;panel.style.display='none'}

function renderPanel(){
  if(!openPanelType){panel.style.display='none';return}
  var h='';
  if(openPanelType==='craft'){
    h+='<h3>Crafting</h3>';
    if(openStation)h+='<p><small>at the '+openStation+'</small></p>';
    else h+='<p><small>portable workbench</small></p>';
    var cats={};
    RECIPES.forEach(function(r){
      if(r.cat==='Refine'&&r.station!==openStation)return;
      if(!cats[r.cat])cats[r.cat]=[];
      cats[r.cat].push(r)});
    ['Refine','Weapons','Tools','Iron Armor','Cloth Armor','Leather Armor'].forEach(function(c){
      if(!cats[c])return;
      h+='<h4>'+c+'</h4>';
      cats[c].forEach(function(r){
        var ok=canAfford(r.cost);
        h+=row(r.name+(r.n>1?' x'+r.n:'')+' <small>'+costStr(r.cost)+'</small>','Craft','c:'+r.id,ok)})});
    h+='<button class="b x" data-a="close">Close</button>';
  } else if(openPanelType==='travel'){
    h+='<h3>Travel Planner</h3><p>Onward. There is no way back.</p>';

function findInteract(){
  var best=null,bd=2.6,now=performance.now();
  for(var i=0;i<ST.length;i++){var d=Math.hypot(P.x-ST[i].x,P.z+4.6);
   if(d<2.4&&d<bd){bd=d;best={kind:'station',st:ST[i]}}}
  var pd=Math.hypot(P.x-PORTAL.x,P.z-PORTAL.z);
  if(pd<PORTAL.r&&pd<bd){bd=pd;best={kind:'portal'}}
  if(donkeyMesh&&!mounted){var dd=Math.hypot(P.x-donkeyMesh.position.x,P.z-donkeyMesh.position.z);
   if(dd<2.5&&dd<bd){bd=dd;best={kind:'donkey'}}}
  var pcx=Math.floor(P.x/CS),pcz=Math.floor(P.z/CS);
  for(var k in chunks){var c=chunks[k];if(!c||!c.nodes)continue;
   if(Math.abs(c.cx-pcx)>1||Math.abs(c.cz-pcz)>1)continue;
   for(var i4=0;i4<c.nodes.length;i4++){var nd=c.nodes[i4];if(nd.state.qty<=0)continue;
    var d2=Math.hypot(P.x-nd.def.x,P.z-nd.def.z);
    if(d2<2.0&&d2<bd){bd=d2;best={kind:'node',node:nd}}}}
  for(var ii=-1;ii<=1;ii++)for(var jj=-1;jj<=1;jj++){
   var X=pcx+ii,Z=pcz+jj,t=ctrees(X,Z);
   for(var q=0;q<t.length;q+=3){var tk=X+','+Z+','+(q/3);
    if(!treeReady(tk,now))continue;
    var d3=Math.hypot(P.x-t[q],P.z-t[q+1]);
    if(d3<1.8&&d3<bd){bd=d3;best={kind:'tree',tk:tk}}}}
  for(var rid in RABBITS){var rb=RABBITS[rid];
   if(!rb.dead||rb.gathered)continue;
   var dr=Math.hypot(P.x-rb.x,P.z-rb.z);
   if(dr<1.8&&dr<bd){bd=dr;best={kind:'corpse',rab:rb}}}
  return best}

  if(openPanelType==='craft'&&openStation&&(!interact||interact.kind!=='station'||interact.st.k!==openStation))closePanel();
  if(openPanelType==='travel'&&(!interact||interact.kind!=='portal'))closePanel();}

function doInteract(){

  if(interact.kind==='node'){startGather('node',interact.node,GATHER_MS,'Gathering '+ITEMS[interact.node.def.type].n+'...');return}
  if(interact.kind==='corpse'){startGather('corpse',interact.rab,GATHER_MS,'Gathering hide...');return}

  atkT=now;acount++;sent=0;me.userData.t=now;
  var fx=Math.sin(P.r),fz=Math.cos(P.r);

   var dx=rb.x-P.x,dz=rb.z-P.z;var dist=Math.hypot(dx,dz);

function sync(ps){var seen={};
 ps.forEach(function(p){var d=p.presence;if(p.isMe||p.kind!=='viewer'||!d||d.x==null)return;
  seen[p.peer]=1;var o=others[p.peer];

   o.g.position.set(num(d.x),.13,num(d.z));scene.add(o.g)}
  o.tx=num(d.x);o.tz=num(d.z);o.ty=num(d.y);o.tr=num(d.r)});

   else if(m.t==='s'&&m.p)sync(m.p.map(function(p){return{peer:p.id,isMe:p.id===myId,kind:'viewer',presence:p}}))};

  if(p[0]>2&&p[0]<94&&p[1]>2&&p[1]<94){mg.fillStyle=others[k].col;mg.beginPath();mg.arc(p[0],p[1],3,0,6.283);mg.fill()}}

  if(dp[0]>2&&dp[0]<94&&dp[1]>2&&dp[1]<94){mg.fillStyle='#8a5a3a';mg.fillRect(dp[0]-2,dp[1]-2,4,4)}}

 mg.fillStyle='#fff';mg.beginPath();mg.moveTo(48+sx*7,48+sz*7);

function updateRabbits(dt,now){
 for(var rid in RABBITS){
  var rb=RABBITS[rid];
  if(rb.gathered)continue;
  var g=rb.mesh;
  if(rb.dead)continue;
  if(rb.mode==='wander'){
    rb.wt-=dt*1000;
    if(rb.wt<=0){rb.wt=1500+Math.random()*2500;
      rb.tx=rb.x+(Math.random()-.5)*8;
      rb.tz=rb.z+(Math.random()-.5)*8;}
    var dx=rb.tx-rb.x,dz=rb.tz-rb.z,dl=Math.hypot(dx,dz);
    if(dl>0.3){var sp=1.2*dt;rb.x+=dx/dl*sp;rb.z+=dz/dl*sp;
      g.rotation.y=Math.atan2(dx,dz);}
  } else if(rb.mode==='chase'||rb.mode==='attack'){
    var pdx=P.x-rb.x,pdz=P.z-rb.z,pd=Math.hypot(pdx,pdz);
    if(pd>12){rb.mode='wander';}
    else if(pd<1.5){
      rb.mode='attack';
      if(now-rb.atkT>RABBIT_ATK_MS){
        rb.atkT=now;
        if(!mounted){
          PSTATS.hp-=RABBIT_DMG*(1-PSTATS.def);
          lastDamageT=now;updateHPUI();
          if(PSTATS.hp<=0){PSTATS.hp=PSTATS.maxHp;say('You were knocked out. Waking up...')}}}
    } else {
      rb.mode='chase';
      var sp2=2.6*dt;rb.x+=pdx/pd*sp2;rb.z+=pdz/pd*sp2;
      g.rotation.y=Math.atan2(pdx,pdz);}
  }
  g.position.set(rb.x,hgt(rb.x,rb.z),rb.z);
 }}

 var sy=Math.sin(yaw),cy=Math.cos(yaw),mx=-sy*iz+cy*ix,mz=-cy*iz-sy*ix,l=Math.hypot(mx,mz);

  var sp=keys.ShiftLeft||keys.ShiftRight?16:6;

  if(mounted)sp*=MOUNT_SPEED;
  var nx=P.x+mx*sp*dt,nz=P.z+mz*sp*dt;

 updateWorld();chkNear();updateRabbits(dt,performance.now());

 for(var k3 in others){var o=others[k3],g=o.g,f=Math.min(1,dt*10);
  if(o.tx!==undefined){g.position.x+=(o.tx-g.position.x)*f;g.position.z+=(o.tz-g.position.z)*f;
   g.position.y+=(o.ty-g.position.y)*f;
   g.rotation.y+=(((o.tr-g.rotation.y+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*f}}

 var nnow2=performance.now();
 if(P._px===undefined){P._px=P.x;P._pz=P.z}
 var psp=Math.min(20,Math.hypot(P.x-P._px,P.z-P._pz)/Math.max(dt,1e-3));
 P._px=P.x;P._pz=P.z;

 for(var k4 in others){var og=others[k4].g;

 var d=mounted?9:7,cp=Math.cos(pitch);

 torches.forEach(function(l2){l2.intensity=1.2+Math.sin(t*9+l2.userData.s)*.18+Math.sin(t*23+l2.userData.s)*.1});
 portalInner.rotation.z=t*0.35;portalRunes.rotation.z=-t*0.55;

 renderer.render(scene,cam);
