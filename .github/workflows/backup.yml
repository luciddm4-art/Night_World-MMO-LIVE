name: Nightly backup
# Exports every account to an ENCRYPTED file kept for 30 days as a workflow artifact.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions): DATABASE_URL and BACKUP_PASSPHRASE.
# Without them the job just says "skipped". See docs/BACKUP.md.
on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Export and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Skipped: add the DATABASE_URL and BACKUP_PASSPHRASE secrets (docs/BACKUP.md)."; exit 0
          fi
          node tools/export.mjs plain.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in plain.json -out nwo-backup.enc -pass env:BACKUP_PASSPHRASE
          shred -u plain.json
          ls -l nwo-backup.enc
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('nwo-backup.enc') != '' }}
        with:
          name: nwo-backup-encrypted
          path: nwo-backup.enc
          retention-days: 30
