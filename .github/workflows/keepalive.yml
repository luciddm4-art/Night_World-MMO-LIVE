# Backup keep-alive: pings the free Render server every 5 minutes (GitHub's minimum). The server also pings itself
# (server/keepalive.js) while it is running; this is what wakes it up if it ever does go to sleep.
# GitHub schedules are best-effort (they can run late) and are paused after 60 days with no repo activity.
# Delete this file to turn it off.
name: Keep server awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 https://night-world-mmo-live.onrender.com/health
