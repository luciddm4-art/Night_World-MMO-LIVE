name: Browser test
# Runs the real game in headless Chromium (login, move, gather, craft, fight, chat, reconnect).
# Unit tests can't catch things like a bad import name; this can. It takes a few minutes.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      # Software rendering on a shared runner is slow and timing-sensitive, so one retry is allowed:
      # a real bug fails both attempts, a timing hiccup does not.
      - run: node e2e/e2e.mjs || (echo '--- retrying once ---' && node e2e/e2e.mjs)
        env:
          E2E_OUT: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
